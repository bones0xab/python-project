# Pytest Configuration

[pytest]
# Test paths
testpaths = api_testing/tests

# Python files
python_files = test_*.py

# Python classes
python_classes = Test*

# Python functions
python_functions = test_*

# Markers
markers =
    api_test: marks tests as API tests (deselect with '-m "not api_test"')

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    -p api_testing.pytest_plugin

# Console output style
console_output_style = progress
